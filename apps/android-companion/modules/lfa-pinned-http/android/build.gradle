plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.localfitnessadvisor.pinnedhttp'
version = '0.1.0'

android {
  namespace "com.localfitnessadvisor.pinnedhttp"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
  }
  lintOptions {
    abortOnError false
  }
}
