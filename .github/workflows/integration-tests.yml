# Integration tests also run on every push/PR via the `storage-validation` job in
# ci.yml. This workflow stays as a manual escape hatch for re-running them alone.
name: Integration tests

on:
  workflow_dispatch:

jobs:
  integration:
    # Windows is the only platform with a pinned httpfs extension SHA.
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      VITANA_REQUIRE_DUCKDB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Prepare DuckDB encryption extension
        run: npm run prepare:duckdb -w @vitana/api

      - name: Build shared package
        run: |
          npm run build -w packages/shared
          npm run build -w packages/api-client

      - name: Run integration tests
        run: npm run test:integration
