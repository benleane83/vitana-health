name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-preview-release:
    name: Unsigned Windows preview installer
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne "tag" -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match desktop version 'v$version'."
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Package unsigned Windows preview installer
        run: npm run package:desktop

      - name: Verify preview artifacts are unsigned
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1
            Get-Item "apps/desktop/dist/win-unpacked/Vitana Health.exe"
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "NotSigned") {
              throw "Unsigned preview artifact unexpectedly has signature status $($signature.Status): $($file.FullName)"
            }
          }

      - name: Validate desktop update assets
        shell: pwsh
        run: |
          $dist = "apps/desktop/dist"
          $metadataPath = Join-Path $dist "latest.yml"
          $installer = Get-ChildItem "$dist/*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "$dist/*.exe.blockmap" | Select-Object -First 1
          if (!(Test-Path $metadataPath) -or !$installer -or !$blockmap) {
            throw "Expected latest.yml, installer, and installer blockmap from this package job."
          }
          $metadata = Get-Content $metadataPath -Raw
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($metadata -notmatch "(?m)^version:\s+$([regex]::Escape($version))\s*$") {
            throw "latest.yml version does not match packaged desktop version $version."
          }
          if ($metadata -notmatch [regex]::Escape($installer.Name)) {
            throw "latest.yml does not reference $($installer.Name)."
          }
          $sha512 = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installer.FullName))
          )
          if ($metadata -notmatch [regex]::Escape($sha512)) {
            throw "latest.yml SHA-512 does not match $($installer.Name)."
          }

      - name: Smoke test installer and packaged runtime
        shell: pwsh
        run: >
          ./scripts/windows-desktop-smoke.ps1
          -Installer (Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1).FullName
          -EvidenceDirectory desktop-release-evidence
          -Scope Fast
          -HealthTimeoutSeconds 60

      - name: Write release checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist/* -Include *.exe,*.yml,*.blockmap | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower()) *$($_.Path | Split-Path -Leaf)" } |
            Set-Content apps/desktop/dist/SHA256SUMS.txt

      - name: Upload preview update assets and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-preview-release
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/SHA256SUMS.txt
            desktop-release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish unsigned desktop preview update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem apps/desktop/dist/* -Include *.exe,*.yml,*.blockmap | ForEach-Object FullName
          ) + "apps/desktop/dist/SHA256SUMS.txt"
          if (gh release view $env:GITHUB_REF_NAME) {
            $release = gh release view $env:GITHUB_REF_NAME --json isDraft | ConvertFrom-Json
            if ($release.isDraft) { throw "The matching GitHub Release must not be a draft." }
            gh release upload $env:GITHUB_REF_NAME $files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $files --verify-tag --generate-notes --title "Vitana Health Preview $env:GITHUB_REF_NAME"
          }
