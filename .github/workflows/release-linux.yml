name: Ubuntu AppImage release

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful graphical package workflow run ID for this exact tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  linux-preview-release:
    name: Stage Ubuntu AppImage draft
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify selected ref and graphical evidence revision
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Dispatch this workflow from the exact desktop version tag (v$version)." >&2
            exit 1
          fi
          evidence_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" --jq .head_sha)
          if [[ "$evidence_sha" != "$GITHUB_SHA" ]]; then
            echo "Graphical evidence was produced for $evidence_sha, not $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Download AppImage and package evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: gh run download "$EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ubuntu-appimage-package --dir release-assets

      - name: Download required GNOME runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: gh run download "$EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ubuntu-gnome-runtime-evidence --dir graphical-evidence

      - name: Verify evidence matches the AppImage
        run: |
          appimage=$(find release-assets -name '*.AppImage' -type f -print -quit)
          expected=$(head -n 1 graphical-evidence/appimage-smoke-evidence.txt | cut -d' ' -f1)
          actual=$(sha256sum "$appimage" | cut -d' ' -f1)
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s *%s\n' "$actual" "$(basename "$appimage")" > release-assets/SHA256SUMS-linux-x64.txt

      - name: Stage Linux assets on draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appimage=$(find release-assets -name '*.AppImage' -type f -print -quit)
          checksum=release-assets/SHA256SUMS-linux-x64.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            if [[ "$draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to alter it." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$appimage" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$appimage" "$checksum" --draft --verify-tag \
              --generate-notes --title "Vitana Health Preview $GITHUB_REF_NAME"
          fi
