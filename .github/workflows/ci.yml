name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # schedule:
  #   # Run the full desktop lifecycle smoke test daily at 03:00 UTC.
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      desktop_smoke_scope:
        description: Windows desktop smoke-test scope
        required: false
        default: fast
        type: choice
        options:
          - fast
          - full

jobs:
  # ─── Typecheck & build ───────────────────────────────────────────────────────
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (workspace)
        run: npm run typecheck

      - name: Build (workspace)
        run: npm run build

      - name: Typecheck Android companion
        run: npm run typecheck -w apps/android-companion

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Core tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Build shared package (required by tests)
        run: npm run build -w packages/shared

      - name: Run core tests
        run: npm run test:core

      - name: Run desktop tests
        run: npm run test:desktop

  windows-desktop:
    name: Windows desktop package smoke test
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck-and-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Run desktop tests
        run: npm run test -w @local-fitness-advisor/desktop

      - name: Determine desktop smoke scope
        id: determine_smoke_scope
        shell: pwsh
        env:
          DISPATCHED_SMOKE_SCOPE: ${{ inputs.desktop_smoke_scope }}
        run: |
          $scope = if (
            $env:GITHUB_EVENT_NAME -eq "schedule" -or
            $env:GITHUB_REF -like "refs/heads/release/*" -or
            $env:DISPATCHED_SMOKE_SCOPE -eq "full"
          ) { "Full" } else { "Fast" }
          "scope=$scope" >> $env:GITHUB_OUTPUT

      - name: Package baseline installer
        if: steps.determine_smoke_scope.outputs.scope == 'Full'
        run: npm run package -w @local-fitness-advisor/desktop -- --config.extraMetadata.version=0.0.0-baseline --config.directories.output=dist-baseline

      - name: Package candidate installer
        run: npm run package:desktop

      - name: Smoke test installed encrypted DuckDB runtime
        shell: pwsh
        run: |
          $arguments = @{
            Installer = (Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1).FullName
            EvidenceDirectory = "desktop-test-evidence"
            Scope = "${{ steps.determine_smoke_scope.outputs.scope }}"
          }
          if ($arguments.Scope -eq "Full") {
            $arguments.BaselineInstaller = (Get-ChildItem apps/desktop/dist-baseline/*.exe | Select-Object -First 1).FullName
          }
          & ./scripts/windows-desktop-smoke.ps1 @arguments

      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-desktop-test-evidence
          path: |
            desktop-test-evidence
            apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android-native-tests:
    name: Android native tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Android host
        working-directory: apps/android-companion
        run: npx expo prebuild --platform android --no-install

      - name: Run pinned HTTP module tests
        working-directory: apps/android-companion/android
        run: ./gradlew :lfa-pinned-http:testDebugUnitTest

  # ─── Dependency audit ────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit for high/critical vulnerabilities (allowlist-aware)
        run: npm run audit:ci

  # ─── Dependency review (PRs only) ────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
