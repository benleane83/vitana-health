name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # schedule:
  #   # Run the full desktop lifecycle smoke test daily at 03:00 UTC.
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      desktop_smoke_scope:
        description: Windows desktop smoke-test scope
        required: false
        default: fast
        type: choice
        options:
          - fast
          - full
      desktop_package_format:
        description: Windows desktop package format
        required: false
        default: nsis
        type: choice
        options:
          - nsis
          - store

jobs:
  # ─── Typecheck & build ───────────────────────────────────────────────────────
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (workspace)
        run: npm run typecheck

      - name: Build (workspace)
        run: npm run build

      - name: Typecheck Android companion
        run: npm run typecheck -w apps/android-companion

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Core tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Build shared package (required by tests)
        run: npm run build -w packages/shared

      - name: Build api-client package (required by tests)
        run: npm run build -w packages/api-client

      - name: Run core tests
        run: npm run test:core

      - name: Run desktop tests
        run: npm run test:desktop

  windows-desktop:
    name: Windows desktop package smoke test
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck-and-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Run desktop tests
        run: npm run test -w @vitana/desktop

      - name: Determine desktop smoke scope
        id: determine_smoke_scope
        shell: pwsh
        env:
          DISPATCHED_SMOKE_SCOPE: ${{ inputs.desktop_smoke_scope }}
        run: |
          $scope = if (
            $env:GITHUB_EVENT_NAME -eq "schedule" -or
            $env:GITHUB_REF -like "refs/heads/release/*" -or
            $env:DISPATCHED_SMOKE_SCOPE -eq "full"
          ) { "Full" } else { "Fast" }
          "scope=$scope" >> $env:GITHUB_OUTPUT

      - name: Package baseline installer
        if: steps.determine_smoke_scope.outputs.scope == 'Full' && inputs.desktop_package_format == 'nsis'
        run: npm run package -w @vitana/desktop -- --config.extraMetadata.version=0.0.0-baseline --config.directories.output=dist-baseline

      - name: Package candidate installer
        if: inputs.desktop_package_format == 'nsis'
        run: npm run package:desktop

      - name: Package Store-test AppX
        if: inputs.desktop_package_format == 'store'
        run: npm run package:store

      - name: Sign Store-test AppX with an ephemeral certificate
        if: inputs.desktop_package_format == 'store'
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Vitana Health Store Test" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Vitana Health ephemeral CI Store test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $cerPath = Join-Path $env:RUNNER_TEMP "vitana-store-test.cer"
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          "VITANA_STORE_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK SignTool was not found." }
          $package = Get-ChildItem apps/desktop/dist-store/*.appx | Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE." }

      - name: Smoke test installed NSIS encrypted DuckDB runtime
        if: inputs.desktop_package_format == 'nsis'
        shell: pwsh
        run: |
          $arguments = @{
            Installer = (Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1).FullName
            EvidenceDirectory = "desktop-test-evidence"
            Scope = "${{ steps.determine_smoke_scope.outputs.scope }}"
          }
          if ($arguments.Scope -eq "Full") {
            $arguments.BaselineInstaller = (Get-ChildItem apps/desktop/dist-baseline/*.exe | Select-Object -First 1).FullName
          }
          & ./scripts/windows-desktop-smoke.ps1 @arguments

      - name: Smoke test installed Store-test encrypted DuckDB runtime
        if: inputs.desktop_package_format == 'store'
        shell: pwsh
        run: >
          ./scripts/windows-store-smoke.ps1
          -Package (Get-ChildItem apps/desktop/dist-store/*.appx | Select-Object -First 1).FullName
          -EvidenceDirectory desktop-test-evidence

      - name: Remove ephemeral Store-test certificate
        if: always() && inputs.desktop_package_format == 'store'
        shell: pwsh
        run: |
          if ($env:VITANA_STORE_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:VITANA_STORE_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:VITANA_STORE_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP "vitana-store-test.cer") -ErrorAction SilentlyContinue

      - name: Upload NSIS desktop test evidence
        if: always() && inputs.desktop_package_format == 'nsis'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-desktop-nsis-test-evidence
          path: |
            desktop-test-evidence
            apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Store desktop test evidence
        if: always() && inputs.desktop_package_format == 'store'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-desktop-store-test-evidence
          path: |
            desktop-test-evidence
            apps/desktop/dist-store/*.appx
          if-no-files-found: error
          retention-days: 14

  android-native-tests:
    name: Android native tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Android host
        working-directory: apps/android-companion
        run: npx expo prebuild --platform android --no-install

      - name: Run pinned HTTP module tests
        working-directory: apps/android-companion/android
        run: ./gradlew :vitana-pinned-http:testDebugUnitTest

  # ─── Dependency audit ────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit for high/critical vulnerabilities (allowlist-aware)
        run: npm run audit:ci

  # ─── Dependency review (PRs only) ────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
