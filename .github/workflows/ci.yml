name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # schedule:
  #   # Run the full desktop lifecycle smoke test daily at 03:00 UTC.
  #   - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Typecheck & build ───────────────────────────────────────────────────────
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (workspace)
        run: npm run typecheck

      - name: Build (workspace)
        run: npm run build

      - name: Typecheck Android companion
        run: npm run typecheck -w apps/android-companion

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Core tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      - name: Build shared package (required by tests)
        run: npm run build -w packages/shared

      - name: Build api-client package (required by tests)
        run: npm run build -w packages/api-client

      - name: Run core tests
        run: npm run test:core

      - name: Run desktop tests
        run: npm run test:desktop

  # ─── Storage validation (integration + durability, real encrypted DuckDB) ────
  storage-validation:
    name: Storage validation
    # Windows is the only platform with a pinned httpfs extension SHA, so the
    # encrypted-DuckDB suites can only run for real here.
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      # Turns a missing extension into a hard failure instead of a silent skip.
      VITANA_REQUIRE_DUCKDB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install DuckDB native binding
        run: npm rebuild duckdb

      # Must precede prepare:duckdb, which reads the DuckDB pin from the shared package's build
      # output rather than its source.
      - name: Build shared packages (required by tests)
        run: |
          npm run build -w packages/shared
          npm run build -w packages/api-client

      - name: Prepare DuckDB encryption extension
        run: npm run prepare:duckdb -w @vitana/api

      - name: Run integration tests
        run: npm run test:integration

      - name: Run durability tests
        run: npm run test:durability

  # ─── Dependency audit ────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit for high/critical vulnerabilities (allowlist-aware)
        run: npm run audit:ci

  # ─── Dependency review (PRs only) ────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
